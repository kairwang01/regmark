name: Release

# Push a tag such as v0.2.0 on a commit of main whose package.json already
# says 0.2.0 and whose dist/regmark.mjs is up to date. This workflow then:
#   1. checks that the tag is on main, and runs every check again on exactly
#      that commit
#   2. creates a DRAFT GitHub release with the bundle and its SHA-256 attached
#      and the matching CHANGELOG section as the notes
#   3. publishes the package to npm with provenance
#   4. moves the major tag (v0, later v1) to the release, so
#      `uses: kairwang01/regmark@v0` follows the latest compatible release
#   5. publishes the draft, but only when the repository variable
#      PUBLISH_RELEASE is 'true'
#
# The release is left as a draft by default because listing a version on
# GitHub Marketplace can only be done by hand: open the draft on GitHub, tick
# "Publish this Action to the GitHub Marketplace", choose the categories and
# press "Publish release". Irreversible steps come last: an npm version can
# never be republished, and a published immutable release locks its tag, while
# a draft and its tag can still be deleted if anything before them failed.
#
# npm: the first publish of a new package cannot use trusted publishing, so it
# needs the NPM_TOKEN secret (a granular token that may publish). After it,
# add a trusted publisher on npmjs.com (repository kairwang01/regmark,
# workflow release.yml, environment npm, allowed action "npm publish"),
# release once within two days so the configuration is validated, then delete
# the NPM_TOKEN secret.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - id: version
        name: The tag must be on main and match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG points at a commit that is not on main" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Smoke-test the standalone bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(node dist/regmark.mjs --version)" = "$VERSION"
          node dist/regmark.mjs demo --html /tmp/regmark-defects.html
          node dist/regmark.mjs demo --clean --html /tmp/regmark-clean.html

  draft-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The section headed "## <version>" up to the next "## " heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([ (]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          {
            echo
            echo '### Install'
            echo
            echo '```bash'
            echo "npx regmark@$VERSION demo"
            echo '```'
            echo
            echo 'GitHub Actions: `uses: kairwang01/regmark@v'"$VERSION"'` or `@v'"${VERSION%%.*}"'`.'
            echo
            echo 'With no package manager: download `regmark.mjs` below and run `node regmark.mjs demo` (Node 22 or later). Check it with `sha256sum -c regmark.mjs.sha256`.'
          } >> release-notes.md
      - name: Checksum the bundle
        run: |
          cd dist
          sha256sum regmark.mjs > regmark.mjs.sha256
          cat regmark.mjs.sha256
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Assets go on while it is a draft: an immutable release cannot gain them later.
          gh release create "$TAG" dist/regmark.mjs dist/regmark.mjs.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Regmark $TAG" --notes-file release-notes.md

  npm:
    needs: [verify, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # With trusted publishing, npm exchanges this job's OIDC token for a
    # short-lived publish token and attaches provenance. Until it is set up,
    # the NPM_TOKEN secret is used instead.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 24 bundles an npm new enough for trusted publishing (11.5.1 or later).
          node-version: 24
          # A release build never restores a cache another job could have written.
          package-manager-cache: false
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) process.exit(1)' "$(npm --version)" \
            || { echo "npm 11.5.1 or later is needed for trusted publishing" >&2; exit 1; }
          # An empty token must not be written: it would stand in front of trusted publishing.
          if [ -n "$NPM_TOKEN" ]; then
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          fi
          # The checks ran in the verify job; prepublishOnly would need pnpm and
          # the dev dependencies here, so scripts are skipped for this step only.
          npm publish --provenance --access public --ignore-scripts

  major-tag:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # GitHub can refuse to let GITHUB_TOKEN move a ref past a commit that
          # changes workflow files. A RELEASE_TOKEN secret with the workflow
          # scope avoids that; without one, a refusal is reported below.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A plain tag with no release of its own, so it can keep moving even
          # when releases are immutable.
          major="${TAG%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          if ! git push --force origin "refs/tags/$major"; then
            # npm already has this version; failing here would only hide what is left to do.
            echo "::warning::$major was not moved; move it by hand: git tag -f $major $TAG && git push -f origin $major"
            {
              echo "### Move $major by hand"
              echo
              echo '```bash'
              echo "git fetch --tags && git tag -f $major $TAG && git push -f origin $major"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-release:
    needs: major-tag
    if: vars.PUBLISH_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  next-steps:
    needs: major-tag
    if: vars.PUBLISH_RELEASE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say what is left to do by hand
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### $TAG is on npm; the GitHub release is a draft"
            echo
            echo "Open https://github.com/$GITHUB_REPOSITORY/releases, edit the draft for $TAG,"
            echo 'tick **Publish this Action to the GitHub Marketplace**, choose the categories'
            echo 'and press **Publish release**.'
          } >> "$GITHUB_STEP_SUMMARY"
