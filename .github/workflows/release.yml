name: Release

# Push a tag such as v0.2.0 on a commit of main whose package.json already
# says 0.2.0 and whose dist/regmark.mjs is up to date. This workflow then:
#   1. runs every check again on exactly that commit
#   2. creates the GitHub release, with the bundle and its SHA-256 attached
#      and the matching CHANGELOG section as the notes
#   3. publishes the package to npm with provenance
#   4. moves the major tag (v0, later v1) to the release, so
#      `uses: kairwang01/regmark@v0` follows the latest compatible release
#
# Listing a release on GitHub Marketplace is a separate, manual step: edit the
# release on GitHub and tick "Publish this Action to the GitHub Marketplace".

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - id: version
        name: The tag must match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Smoke-test the standalone bundle
        run: |
          node dist/regmark.mjs --version
          node dist/regmark.mjs demo --html /tmp/regmark-defects.html
          node dist/regmark.mjs demo --clean --html /tmp/regmark-clean.html

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The section headed "## <version>" up to the next "## " heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([ (]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          {
            echo
            echo '### Install'
            echo
            echo '```bash'
            echo "npx regmark@$VERSION demo"
            echo '```'
            echo
            echo 'Or with no package manager: download `regmark.mjs` below and run `node regmark.mjs demo` (Node 22 or later). Check it against `regmark.mjs.sha256`.'
          } >> release-notes.md
      - name: Checksum the bundle
        run: |
          cd dist
          sha256sum regmark.mjs > regmark.mjs.sha256
          cat regmark.mjs.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/regmark.mjs dist/regmark.mjs.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Regmark $TAG" --notes-file release-notes.md

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: npm exchanges this workflow's OIDC token for a
    # short-lived publish token, and attaches a provenance statement. Set it
    # up once on npmjs.com (package settings, Trusted publisher: this
    # repository, workflow release.yml). Until then an NPM_TOKEN secret works.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install --global npm@11
          npm --version
          # The checks ran in the verify job; prepublishOnly would need pnpm and
          # the dev dependencies here, so it is skipped for this step only.
          npm publish --provenance --access public --ignore-scripts

  major-tag:
    needs: [github-release, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
